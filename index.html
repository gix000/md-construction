<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>M.D Construction — Building Quality. Creating Trust.</title>
<meta name="description" content="M.D Construction by Maroun Daaboul. Interior &amp; exterior construction and finishing works in Lebanon."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --navy:#0a1830; --navy-2:#0e2148; --navy-3:#13284f;
  --paper:#f6f7f9; --white:#ffffff; --ink:#0c1730; --muted:#5a6781;
  --gold:#f4a91f; --gold-deep:#e0951a;
  --c-green:#5aa730; --c-blue:#3b86e0; --c-yellow:#f4c12e; --c-orange:#e8682a;
  --line:rgba(12,23,48,.10);
  --shadow:0 18px 50px -18px rgba(10,24,48,.45);
  --maxw:1200px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
h1,h2,h3,.display{font-family:"Anton",Impact,sans-serif;font-weight:400;letter-spacing:.01em;line-height:.96;text-transform:uppercase}
.eyebrow{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.28em;font-weight:600;font-size:.72rem}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
.btn{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:.55rem;padding:.9rem 1.5rem;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .25s,box-shadow .25s,background .25s,color .25s}
.btn svg{width:18px;height:18px}
.btn-gold{background:var(--gold);color:var(--navy);box-shadow:0 10px 24px -10px rgba(244,169,31,.8)}
.btn-gold:hover{transform:translateY(-3px);background:#ffba30}
.btn-ghost{border-color:rgba(255,255,255,.35);color:#fff}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{transform:translateY(-3px);background:var(--navy-2)}

/* 4-color signature bar */
.cbar{display:flex;height:6px;width:120px;border-radius:6px;overflow:hidden}
.cbar span{flex:1}
.cbar i:nth-child(1){background:var(--c-green)}
.cbar span:nth-child(1){background:var(--c-green)}
.cbar span:nth-child(2){background:var(--c-blue)}
.cbar span:nth-child(3){background:var(--c-yellow)}
.cbar span:nth-child(4){background:var(--c-orange)}

/* ---------- top strip ---------- */
.topstrip{background:var(--navy);color:#cfd8ea;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.06)}
.topstrip .wrap{display:flex;justify-content:flex-end;align-items:center;gap:1rem;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}
.topstrip a{display:inline-flex;gap:.4rem;align-items:center;color:#cfd8ea}
.topstrip a:hover{color:var(--gold)}
.topstrip .right{display:flex;gap:1.4rem;flex-wrap:wrap}
.topstrip svg{width:14px;height:14px;opacity:.8}

/* ---------- nav ---------- */
header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:padding .25s, box-shadow .25s}
header.nav.shrink{box-shadow:0 10px 30px -18px rgba(10,24,48,.4)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;transition:padding .25s}
header.nav.shrink .wrap{padding-top:9px;padding-bottom:9px}
.brand{display:flex;align-items:center;gap:.7rem}
.brand .chip{width:46px;height:46px;border-radius:9px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:5px;transition:width .25s,height .25s}
.brand .chip img{width:100%;height:100%;object-fit:contain}
.brand .name{display:block;font-family:"Anton",sans-serif;font-size:1.28rem;line-height:.9;color:var(--navy)}
.brand .name b{color:var(--gold);font-weight:400}
.brand .tag{display:block;font-family:"Oswald",sans-serif;font-size:.56rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.brand .tag .q{color:var(--c-blue)} .brand .tag .t{color:var(--c-green)}
.menu{display:flex;align-items:center;gap:1.9rem}
.menu a.link{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;font-weight:500;color:var(--ink);position:relative;padding:4px 0}
.menu a.link::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:var(--gold);transition:width .25s}
.menu a.link:hover::after{width:100%}
.menu a.link:hover{color:var(--navy)}
.navcta{display:flex;align-items:center;gap:.7rem}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;cursor:pointer;padding:6px}
.burger span{width:26px;height:3px;background:var(--navy);border-radius:3px;transition:.3s}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;padding:84px 0 96px}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(circle at 70% 30%,#000,transparent 75%);opacity:.7}
.hero .glow{position:absolute;width:620px;height:620px;right:-160px;top:-160px;background:radial-gradient(circle,rgba(244,169,31,.22),transparent 60%);pointer-events:none}
.hero .wedge{position:absolute;right:0;top:0;bottom:0;width:42%;background:linear-gradient(135deg,var(--navy-3),var(--navy-2));clip-path:polygon(22% 0,100% 0,100% 100%,0 100%);opacity:.9}
.hero .ghost{position:absolute;right:4%;bottom:-6%;width:min(46%,560px);opacity:.10;filter:grayscale(.2)}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr;gap:40px;align-items:center}
.hero .eyebrow{color:var(--gold)}
.hero h1{font-size:clamp(2.9rem,6.6vw,5.4rem);margin:18px 0 8px}
.hero h1 .o{color:var(--gold)}
.hero .lead{max-width:560px;color:#c5cee2;font-size:1.05rem;margin:18px 0 8px}
.hero .actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:26px}
.hero .owner{margin-top:30px;display:flex;align-items:center;gap:14px}
.hero .owner .dot{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:"Anton",sans-serif;font-size:1.2rem}
.hero .owner small{display:block;color:#9fb0cf;font-family:"Oswald",sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:.66rem}
.hero .owner strong{font-family:"Oswald",sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.02em}

/* arabic card in hero */
.ar-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:26px 26px 22px;backdrop-filter:blur(4px)}
.ar-card .cbar{margin-bottom:16px}
.ar-block{direction:rtl;text-align:right;font-family:"Tajawal",sans-serif}
.ar-block h3{font-family:"Tajawal",sans-serif;font-weight:800;text-transform:none;font-size:1.5rem;line-height:1.4;color:#fff;letter-spacing:0}
.ar-block p{font-family:"Tajawal",sans-serif;font-size:1.06rem;color:#d4ddef;line-height:2;margin-top:10px}
.ar-block .guar{color:var(--gold);font-weight:700;margin-top:14px;font-size:1.04rem}

/* ---------- generic section ---------- */
section{padding:92px 0}
.sec-head{max-width:720px}
.sec-head .eyebrow{color:var(--gold-deep)}
.sec-head h2{font-size:clamp(2.1rem,4.4vw,3.2rem);color:var(--navy);margin:14px 0}
.sec-head h2 .o{color:var(--gold)}
.sec-head p{color:var(--muted);font-size:1.04rem}
.sec-head .cbar{margin-bottom:6px}

/* about */
.about{background:var(--white)}
.about .grid{display:grid;grid-template-columns:1fr;gap:40px;max-width:840px}
.about .lead-en{font-size:1.12rem;color:var(--ink);line-height:1.8}
.about .lead-en .hl{background:linear-gradient(transparent 62%,rgba(244,169,31,.35) 0);font-weight:600}
.ar-under{margin-top:30px;padding-top:24px;border-top:1px solid var(--line);text-align:right}
.ar-cbar{direction:ltr;margin:0 0 18px auto}
.ar-lead{font-family:"Tajawal",sans-serif;font-size:1.18rem;line-height:2.05;color:#26324c;font-weight:500}
.ar-lead+.ar-lead{margin-top:14px}
.ar-guar{display:inline-block;font-family:"Tajawal",sans-serif;margin-top:16px;font-size:1.1rem;font-weight:700;color:var(--navy);border-right:4px solid var(--gold);padding-right:14px}
.about .panel{position:relative;background:var(--navy);border-radius:16px;padding:40px;color:#fff;box-shadow:var(--shadow);overflow:hidden}
.about .panel::after{content:"";position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border:18px solid rgba(244,169,31,.18);border-radius:50%}
.about .panel .ar-block h3{font-size:1.35rem}
.about .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.about .stat b{font-family:"Anton",sans-serif;font-size:2rem;color:var(--navy);display:block}
.about .stat span{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--muted)}

/* services */
.services{background:var(--paper);position:relative}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:46px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 26px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}
.card::before{content:"";position:absolute;left:0;top:0;height:100%;width:5px;background:var(--accent,var(--gold));transform:scaleY(0);transform-origin:top;transition:transform .35s}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:transparent}
.card:hover::before{transform:scaleY(1)}
.card .ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent,var(--gold)) 14%,#fff);color:var(--accent,var(--gold));margin-bottom:18px}
.card .ic svg{width:28px;height:28px}
.card h3{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:1.12rem;color:var(--navy);line-height:1.15}
.card p{color:var(--muted);font-size:.95rem;margin-top:9px}

/* why / trust */
.why{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.why::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;opacity:.5}
.why .sec-head h2{color:#fff}.why .sec-head p{color:#aebbd6}
.why .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:48px;position:relative;z-index:2}
.why .cred{margin:36px 0;padding:28px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.cred .cbar{margin:0 auto 18px;display:inline-flex}
.cred-en{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:1.04rem;color:#fff;margin-bottom:8px}
.cred-ar{font-family:"Tajawal",sans-serif;font-size:1.2rem;line-height:1.8;color:#d0dce8;font-weight:500;text-align:right;direction:rtl}
.trust{text-align:center;padding:30px 18px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.03);transition:transform .3s,background .3s}
.trust:hover{transform:translateY(-6px);background:rgba(255,255,255,.06)}
.trust .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;border:2px solid var(--accent)}
.trust .ic svg{width:30px;height:30px;color:var(--accent)}
.trust b{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.08em;display:block;font-size:1.02rem}
.trust span{color:#a9b6d2;font-size:.84rem}

/* contact */
.contact{background:var(--white)}
.contact .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px}
.cinfo .item{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px dashed var(--line)}
.cinfo .item:last-child{border-bottom:0}
.cinfo .ic{width:50px;height:50px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}
.cinfo .ic svg{width:22px;height:22px}
.cinfo .item>div{min-width:0;flex:1}
.cinfo small{display:block;margin-bottom:5px;font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:.68rem}
.cinfo .item a,.cinfo .item p{display:block;font-size:1.1rem;color:var(--navy);font-weight:600;overflow-wrap:anywhere;word-break:break-word}
.cinfo .item a:hover{color:var(--gold-deep)}
.cform{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:34px}
.cform h3{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-size:1.3rem;font-weight:700}
.field{margin-top:16px}
.field label{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--muted);display:block;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:8px;font-family:"Manrope",sans-serif;font-size:.98rem;background:#fff;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,169,31,.18)}
.cform .btn{width:100%;justify-content:center;margin-top:20px}

/* footer */
footer{background:#06101f;color:#9fb0cf;padding:54px 0 26px}
footer .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}
footer .brand .name{color:#fff}
footer h4{font-family:"Oswald",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#fff;font-size:.92rem;margin-bottom:14px}
footer a{display:block;padding:5px 0;font-size:.92rem}
footer a:hover{color:var(--gold)}
footer .bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:36px;padding-top:18px;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.82rem}
footer .bottom .made b{color:#cfd8ea}

/* reveal */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}.d5{transition-delay:.4s}


/* materials */
.materials{background:var(--white);position:relative}
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px}
.mat-logo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 16px;display:grid;place-items:center;min-height:160px;transition:transform .3s,box-shadow .3s,border-color .3s}
.mat-logo img{width:100%;height:100%;object-fit:contain;opacity:.85;transition:opacity .3s}
.mat-logo:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--gold-deep);opacity:.9}
.mat-logo:hover img{opacity:1}

@media(max-width:920px){
  .logos{grid-template-columns:repeat(2,1fr);gap:18px}
}
@media(max-width:560px){
  .logos{grid-template-columns:1fr;gap:14px}
  .mat-logo{min-height:120px;padding:16px 12px}
}

@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}

/* responsive */
@media(max-width:920px){
  .hero .wrap{grid-template-columns:1fr;gap:30px}
  .hero .wedge,.hero .ghost{display:none}
  .about .grid,.contact .grid{grid-template-columns:1fr;gap:34px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .why .grid{grid-template-columns:repeat(2,1fr)}
  footer .grid{grid-template-columns:1fr 1fr}
  .menu{position:fixed;top:0;right:0;left:auto;height:100vh;height:100dvh;width:min(78%,320px);background:var(--navy);flex-direction:column;align-items:flex-start;justify-content:center;gap:1.4rem;padding:40px;z-index:60;display:none}
  .menu.open{display:flex;animation:slideIn .35s ease}
  .menu a.link{color:#fff;font-size:1.1rem}
  .menu .navcta{flex-direction:column;align-items:stretch;width:100%}
  .burger{display:flex;z-index:61}
  .burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg);background:#fff}
  .burger.open span:nth-child(2){opacity:0}
  .burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg);background:#fff}
}
@media(max-width:560px){
  .cards,.why .grid,footer .grid{grid-template-columns:1fr}
  .cred{margin:24px 0}
  .about .stats{grid-template-columns:1fr 1fr}
  section{padding:64px 0}
  .topstrip{display:none}
}

</style>
</head>

em;line-height:.96;text-transform:uppercase}\n.eyebrow{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.28em;font-weight:600;font-size:.72rem}\n.wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}\n.btn{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:.55rem;padding:.9rem 1.5rem;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:transform .25s,box-shadow .25s,background .25s,color .25s}\n.btn svg{width:18px;height:18px}\n.btn-gold{background:var(--gold);color:var(--navy);box-shadow:0 10px 24px -10px rgba(244,169,31,.8)}\n.btn-gold:hover{transform:translateY(-3px);background:#ffba30}\n.btn-ghost{border-color:rgba(255,255,255,.35);color:#fff}\n.btn-ghost:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}\n.btn-dark{background:var(--navy);color:#fff}\n.btn-dark:hover{transform:translateY(-3px);background:var(--navy-2)}\n\n/* 4-color signature bar */\n.cbar{display:flex;height:6px;width:120px;border-radius:6px;overflow:hidden}\n.cbar span{flex:1}\n.cbar i:nth-child(1){background:var(--c-green)}\n.cbar span:nth-child(1){background:var(--c-green)}\n.cbar span:nth-child(2){background:var(--c-blue)}\n.cbar span:nth-child(3){background:var(--c-yellow)}\n.cbar span:nth-child(4){background:var(--c-orange)}\n\n/* ---------- top strip ---------- */\n.topstrip{background:var(--navy);color:#cfd8ea;font-size:.8rem;border-bottom:1px solid rgba(255,255,255,.06)}\n.topstrip .wrap{display:flex;justify-content:flex-end;align-items:center;gap:1rem;padding-top:9px;padding-bottom:9px;flex-wrap:wrap}\n.topstrip a{display:inline-flex;gap:.4rem;align-items:center;color:#cfd8ea}\n.topstrip a:hover{color:var(--gold)}\n.topstrip .right{display:flex;gap:1.4rem;flex-wrap:wrap}\n.topstrip svg{width:14px;height:14px;opacity:.8}\n\n/* ---------- nav ---------- */\nheader.nav{position:sticky;top:0;z-index:50;background r:var(--muted)}\n\n/* services */\n.services{background:var(--paper);position:relative}\n.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:46px}\n.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 26px;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s,border-color .3s}\n.card::before{content:\"\";position:absolute;left:0;top:0;height:100%;width:5px;background:var(--accent,var(--gold));transform:scaleY(0);transform-origin:top;transition:transform .35s}\n.card:hover{transform:translateY(-8px);box-shadow:var(--shadow);border-color:transparent}\n.card:hover::before{transform:scaleY(1)}\n.card .ic{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent,var(--gold)) 14%,#fff);color:var(--accent,var(--gold));margin-bottom:18px}\n.card .ic svg{width:28px;height:28px}\n.card h3{font-family:\"Oswald\",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:1.12rem;color:var(--navy);line-height:1.15}\n.card p{color:var(--muted);font-size:.95rem;margin-top:9px}\n\n/* why / trust */\n.why{background:var(--navy);color:#fff;position:relative;overflow:hidden}\n.why::before{content:\"\";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;opacity:.5}\n.why .sec-head h2{color:#fff}.why .sec-head p{color:#aebbd6}\n.why .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:48px;position:relative;z-index:2}\n.why .cred{margin:36px 0;padding:28px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);text-align:center}\n.cred .cbar{margin:0 auto 18px;display:inline-flex}\n.cred-en{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.16em;font-weight:600;font-size:1.04rem;color:#fff;margin-bottom:8px}\n.cred-ar{font-family:\"Tajawal\",sans-serif;font-size:1.2rem;line-height:1.8;color:#d0dce8;font-weight:500;text-align:right;direction:rtl}\n.trust{text-align:center;padding:30px 18px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(255,255,255,.03);transition:transform .3s,background .3s}\n.trust:hover{transform:translateY(-6px);background:rgba(255,255,255,.06)}\n.trust .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;border:2px solid var(--accent)}\n.trust .ic svg{width:30px;height:30px;color:var(--accent)}\n.trust b{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.08em;display:block;font-size:1.02rem}\n.trust span{color:#a9b6d2;font-size:.84rem}\n\n/* contact */\n.contact{background:var(--white)}\n.contact .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px}\n.cinfo .item{display:flex;gap:16px;align-items:flex-start;padding:18px 0;border-bottom:1px dashed var(--line)}\n.cinfo .item:last-child{border-bottom:0}\n.cinfo .ic{width:50px;height:50px;border-radius:12px;background:var(--navy);color:var(--gold);display:grid;place-items:center;flex:0 0 auto}\n.cinfo .ic svg{width:22px;height:22px}\n.cinfo .item>div{min-width:0;flex:1}\n.cinfo small{display:block;margin-bottom:5px;font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:.68rem}\n.cinfo .item a,.cinfo .item p{display:block;font-size:1.1rem;color:var(--navy);font-weight:600;overflow-wrap:anywhere;word-break:break-word}\n.cinfo .item a:hover{color:var(--gold-deep)}\n.cform{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:34px}\n.cform h3{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);font-size:1.3rem;font-weight:700}\n.field{margin-top:16px}\n.field label{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem;color:var(--muted);display:block;margin-bottom:6px}\n.field input,.field textarea{width:100%;padding:.85rem 1rem;border:1px solid var(--line);border-radius:8px;font-family:\"Manrope\",sans-serif;font-size:.98rem;background:#fff;transition:border-color .2s,box-shadow .2s}\n.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(244,169,31,.18)}\n.cform .btn{width:100%;justify-content:center;margin-top:20px}\n\n/* footer */\nfooter{background:#06101f;color:#9fb0cf;padding:54px 0 26px}\nfooter .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:34px}\nfooter .brand .name{color:#fff}\nfooter h4{font-family:\"Oswald\",sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#fff;font-size:.92rem;margin-bottom:14px}\nfooter a{display:block;padding:5px 0;font-size:.92rem}\nfooter a:hover{color:var(--gold)}\nfooter .bottom{border-top:1px solid rgba(255,255,255,.08);margin-top:36px;padding-top:18px;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.82rem}\nfooter .bottom .made b{color:#cfd8ea}\n\n/* reveal */\n.reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s ease}\n.reveal.in{opacity:1;transform:none}\n.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}.d5{transition-delay:.4s}\n\n\n/* materials */\n.materials{background:var(--white);position:relative}\n.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:48px}\n.mat-logo{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 16px;display:grid;place-items:center;min-height:160px;transition:transform .3s,box-shadow .3s,border-color .3s}\n.mat-logo img{width:100%;height:100%;object-fit:contain;opacity:.85;transition:opacity .3s}\n.mat-logo:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--gold-deep);opacity:.9}\n.mat-logo:hover img{opacity:1}\n\n@media(max-width:920px){\n  .logos{grid-template-columns:repeat(2,1fr);gap:18px}\n}\n@media(max-width:560px){\n  .logos{grid-template-columns:1fr;gap:14px}\n  .mat-logo{min-height:120px;padding:16px 12px}\n}\n\n@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}\n\n/* responsive */\n@media(max-width:920px){\n  .hero .wrap{grid-template-columns:1fr;gap:30px}\n  .hero .wedge,.hero .ghost{display:none}\n  .about .grid,.contact .grid{grid-template-columns:1fr;gap:34px}\n  .cards{grid-template-columns:repeat(2,1fr)}\n  .why .grid{grid-template-columns:repeat(2,1fr)}\n  footer .grid{grid-template-columns:1fr 1fr}\n  .menu{position:fixed;top:0;right:0;left:auto;height:100vh;height:100dvh;width:min(78%,320px);background:var(--navy);flex-direction:column;align-items:flex-start;justify-content:center;gap:1.4rem;padding:40px;z-index:60;display:none}\n  .menu.open{display:flex;animation:slideIn .35s ease}\n  .menu a.link{color:#fff;font-size:1.1rem}\n  .menu .navcta{flex-direction:column;align-items:stretch;width:100%}\n  .burger{display:flex;z-index:61}\n  .burger.open span:nth-child(1){transform:translateY(8px) rotate(45deg);background:#fff}\n  .burger.open span:nth-child(2){opacity:0}\n  .burger.open span:nth-child(3){transform:translateY(-8px) rotate(-45deg);background:#fff}\n}\n@media(max-width:560px){\n  .cards,.why .grid,footer .grid{grid-template-columns:1fr}\n  .cred{margin:24px 0}\n  .about .stats{grid-template-columns:1fr 1fr}\n  section{padding:64px 0}\n  .topstrip{display:none}\n}\n"}
